name: Java CI & CLI Smoke Test

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Unit Test & Smoke Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 3. Run Unit Tests (JUnit 5)
        run: mvn -B test

      - name: 4. Package Application JAR
        run: mvn -B package -DskipTests

      - name: 5. Ensure Executable Permissions on CLI Scripts
        run: chmod +x credit_simulator bin/credit_simulator

      - name: 6. CLI Smoke Test - Batch File Mode
        run: |
          echo "Testing ./credit_simulator file_inputs.txt..."
          OUTPUT=$(./credit_simulator file_inputs.txt)
          echo "$OUTPUT"
          
          # Memastikan output mengandung hasil perhitungan sesuai Rumus.xlsx
          echo "$OUTPUT" | grep -q "tahun 1 : Rp. 2,250,000.00/bln , Suku Bunga : 8%"
          echo "$OUTPUT" | grep -q "tahun 2 : Rp. 2,432,250.00/bln , Suku Bunga : 8,1%"
          echo "$OUTPUT" | grep -q "tahun 3 : Rp. 2,641,423.50/bln , Suku Bunga : 8,6%"

          echo "Testing bin/credit_simulator file_inputs.txt..."
          bin/credit_simulator file_inputs.txt

      - name: 7. CLI Smoke Test - Interactive Menu Exit
        run: |
          echo "3" | ./credit_simulator

      - name: 8. Upload Executable JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: credit-simulator-jar
          path: target/credit-simulator.jar
          retention-days: 14
