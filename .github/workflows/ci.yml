name: Java CI & CLI Smoke Test

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Unit Test & Smoke Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 3. Run Unit Tests (JUnit 5)
        run: mvn -B test

      - name: 4. Package Application JAR
        run: mvn -B package -DskipTests

      - name: 5. Normalize Line Endings & Permissions
        run: |
          sed -i 's/\r$//' credit_simulator bin/credit_simulator file_inputs.txt || true
          chmod +x credit_simulator bin/credit_simulator

      - name: 6. CLI Smoke Test - Batch File Mode
        continue-on-error: true
        run: |
          set +e
          ./credit_simulator file_inputs.txt
          bin/credit_simulator file_inputs.txt
          exit 0

      - name: 7. CLI Smoke Test - Interactive Menu Exit
        continue-on-error: true
        run: |
          set +e
          echo "3" | ./credit_simulator
          exit 0

      - name: 8. Upload Executable JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: credit-simulator-jar
          path: target/credit-simulator.jar
          retention-days: 14
